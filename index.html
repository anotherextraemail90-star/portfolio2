<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rahul | Web Developer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Portfolio of Rahul, a web developer building fast, clean, mobile-friendly websites.">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--ink:#101628;--muted:#5d6785;--card:rgba(255,255,255,.72);--line:rgba(16,22,40,.1);--a:#5b6cff;--b:#a25bff;--c:#19d3c5;--grad:linear-gradient(120deg,var(--a),var(--b) 55%,var(--c));--sh:0 20px 50px -20px rgba(40,50,120,.35);--field:#fff;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--ink:#eef1ff;--muted:#9ba5c9;--card:rgba(24,31,58,.62);--line:rgba(255,255,255,.1);--sh:0 20px 50px -20px rgba(0,0,0,.7);--field:#10172d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--ink:#eef1ff;--muted:#9ba5c9;--card:rgba(24,31,58,.62);--line:rgba(255,255,255,.1);--sh:0 20px 50px -20px rgba(0,0,0,.7);--field:#10172d;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:5rem;scroll-behavior:smooth}
body{margin:0;font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(40rem 30rem at 10% -5%,color-mix(in srgb,var(--a) 28%,transparent),transparent 70%),radial-gradient(35rem 28rem at 95% 10%,color-mix(in srgb,var(--b) 22%,transparent),transparent 70%),radial-gradient(30rem 24rem at 50% 105%,color-mix(in srgb,var(--c) 18%,transparent),transparent 70%)}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.025em;margin:0;line-height:1.1}
a{color:var(--a)}
:focus-visible{outline:3px solid var(--a);outline-offset:3px;border-radius:.4rem}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.2rem}
.grid{display:grid;gap:1.4rem}.g3{grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}.g4{grid-template-columns:repeat(2,1fr);gap:1rem}
.split{display:grid;grid-template-columns:1.3fr 1fr;gap:3.2rem;align-items:center}.split.top{align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr;gap:2.5rem}}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* header */
header.top{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0}
.brand{font-weight:800;font-size:1.35rem;color:var(--ink);text-decoration:none}.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rt{display:flex;gap:.6rem;align-items:center}
nav{display:flex;align-items:center;gap:.3rem}
nav a{color:var(--muted);text-decoration:none;font-weight:500;padding:.4rem .85rem;border-radius:2rem;transition:.2s}
nav a:hover{color:var(--ink)}nav a.on{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:.8rem;width:2.5rem;height:2.5rem;font-size:1.05rem;cursor:pointer;transition:.2s}.icon:hover{transform:translateY(-2px)}
#burger{display:none}
@media(max-width:760px){#burger{display:block}
 nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;padding:.8rem 1.2rem 1rem;background:var(--bg);border-bottom:1px solid var(--line)}nav.open{display:flex}}
#prog{position:fixed;top:0;left:0;height:3px;width:0;background:var(--grad);z-index:40}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:.9rem;padding:.8rem 1.5rem;font:500 1rem "DM Sans",sans-serif;text-decoration:none;cursor:pointer;background:var(--card);color:var(--ink);transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.btn.fill{background:var(--grad);color:#fff;border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem}
/* hero */
.hero{padding:4.5rem 0 2rem}
.pill{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .9rem;border-radius:2rem;border:1px solid var(--line);background:var(--card);font-size:.9rem;color:var(--muted);margin-bottom:1.2rem}
.pill i{width:.55rem;height:.55rem;border-radius:50%;background:#2ee59d;box-shadow:0 0 0 4px rgba(46,229,157,.25)}
.hero h1{font-size:clamp(2.6rem,7vw,4.9rem);font-weight:800;letter-spacing:-.035em}
.role{font-size:1.4rem;font-weight:500;min-height:2.2rem;margin-top:1.1rem}
.caret{display:inline-block;width:.16rem;height:1.2em;background:var(--a);margin-left:.15rem;vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.lead{color:var(--muted);font-size:1.15rem;max-width:34rem;margin:1rem 0 0}
.pw{width:min(21rem,82%);margin:0 auto;position:relative}
.pw::before{content:"";position:absolute;inset:-6%;border-radius:50%;background:var(--grad);filter:blur(40px);opacity:.45;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) scale(1.04)}}
.pf{position:relative;aspect-ratio:1;border-radius:2rem 50% 2rem 50%;overflow:hidden;padding:4px;background:var(--grad);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center}
.pf img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.pf b{font:800 6rem "Bricolage Grotesque",sans-serif;color:#fff}
.pu{display:block;text-align:center;margin-top:1.6rem;font-size:.9rem;color:var(--muted);cursor:pointer;position:relative}.pu input{display:none}.pu u{color:var(--a)}
/* sections */
.ph{padding:3.5rem 0 .5rem}.ph h1{font-size:clamp(2.4rem,6vw,3.8rem);font-weight:800}.ph p{color:var(--muted);font-size:1.15rem;max-width:36rem;margin:.7rem 0 0}
.blk{padding:2rem 0 3rem}
.st{font-size:clamp(1.5rem,4vw,2rem);font-weight:800;margin-bottom:1.3rem}
.txt p{color:var(--muted);font-size:1.1rem;line-height:1.75;max-width:38rem;margin:0 0 1rem}
.glass{background:var(--card);border:1px solid var(--line);border-radius:1.2rem;backdrop-filter:blur(12px);box-shadow:var(--sh)}
.stat{padding:1.3rem;text-align:center}
.stat b{display:block;font:800 2.2rem/1 "Bricolage Grotesque",sans-serif;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--muted);font-size:.95rem}
/* skills */
.sk{margin-bottom:1.4rem}.sn{display:flex;justify-content:space-between;font-weight:500;margin-bottom:.45rem}
.tr{height:.65rem;background:var(--line);border-radius:1rem;overflow:hidden}
.tr i{display:block;height:100%;width:0;background:var(--grad);border-radius:1rem;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.chip{display:inline-block;padding:.35rem .9rem;border:1px solid var(--line);background:var(--card);border-radius:2rem;margin:0 .4rem .55rem 0;font-size:.9rem;transition:.2s}.chip:hover{transform:translateY(-2px);border-color:var(--a)}
/* projects */
.fl{margin-bottom:.8rem}
.fl button{border:1px solid var(--line);color:var(--ink);background:var(--card);border-radius:2rem;padding:.4rem 1.1rem;margin:0 .4rem .6rem 0;font:500 .95rem "DM Sans",sans-serif;cursor:pointer;transition:.2s}
.fl button.on{background:var(--grad);color:#fff;border-color:transparent}
.pj{display:block;width:100%;height:100%;text-align:left;font:inherit;cursor:pointer;color:var(--ink);padding:0;overflow:hidden;transition:transform .25s,box-shadow .25s}
.pj:hover{transform:translateY(-6px);box-shadow:0 30px 60px -22px rgba(91,108,255,.55)}
.pi{height:9.5rem;display:flex;align-items:center;justify-content:center;font:800 1.8rem "Bricolage Grotesque",sans-serif;color:#14213d;background-size:cover;background-position:center;position:relative}
.pi::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 60%)}
.pb{padding:1.2rem}.pb h3{font-size:1.2rem}.pb p{color:var(--muted);margin:.4rem 0 .9rem}
.tag{display:inline-block;font-size:.8rem;padding:.15rem .65rem;border-radius:2rem;border:1px solid var(--line);margin:0 .3rem .3rem 0;color:var(--muted)}
.sp{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:.5rem;margin-bottom:1.3rem}.sp .st{margin:0}
[hidden]{display:none!important}
dialog{border:1px solid var(--line);border-radius:1.4rem;background:var(--bg);color:var(--ink);padding:0;width:min(30rem,92vw);box-shadow:0 40px 90px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,8,20,.6);backdrop-filter:blur(4px)}
dialog .pi{height:10rem}.dg{padding:1.5rem}.dg p{color:var(--muted)}
/* timeline */
.tl{border-left:2px solid var(--line);padding-left:1.7rem;margin-left:.4rem}
.ti{position:relative;margin-bottom:2rem}
.ti::before{content:"";position:absolute;left:-2.35rem;top:.35rem;width:.95rem;height:.95rem;border-radius:50%;background:var(--grad);box-shadow:0 0 0 5px var(--bg)}
.ti small{color:var(--a);font-weight:700}.ti p{color:var(--muted);max-width:36rem;margin:.2rem 0 0}
/* cta + contact */
.cta{text-align:center;padding:3rem 1.5rem;background:var(--grad);color:#fff;border:0;position:relative;overflow:hidden}
.cta p{opacity:.9}.cta .btn{background:#fff;color:#14213d;border-color:#fff}
.box{padding:2.4rem}
.fm{display:grid;gap:1rem}.fm .two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}@media(max-width:560px){.fm .two{grid-template-columns:1fr}.box{padding:1.4rem}}
.fm input,.fm textarea{width:100%;border:1px solid var(--line);border-radius:.8rem;padding:.85rem 1rem;font:1rem "DM Sans",sans-serif;background:var(--field);color:var(--ink);transition:.2s}
.fm input:focus,.fm textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 25%,transparent)}
.fm .bad{border-color:#ff5d73}
.msg{min-height:1.4rem;font-size:.95rem}.msg.err{color:#ff5d73}.msg.ok{color:#2ee59d}
#top{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:.3s;z-index:25}#top.show{opacity:1;pointer-events:auto}
footer{padding:2rem 0;color:var(--muted);text-align:center;border-top:1px solid var(--line)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.caret,.pw::before{animation:none}.tr i,.pj,.rv{transition:none}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>

<div id="prog"></div>
<header class="top"><div class="wrap bar">
  <a class="brand" href="#home" id="brand"></a>
  <div class="rt"><nav id="nav" aria-label="Main"></nav>

    <button class="icon" id="burger" aria-label="Open menu" aria-expanded="false">☰</button></div>
</div></header>
<main id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>
<button class="icon" id="top" aria-label="Back to top">↑</button>
<dialog id="dlg" aria-label="Project details"></dialog>

<script>

const $ = id => document.getElementById(id);
const E = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const PAGES = [["home","Home"],["about","About"],["skills","Skills"],["projects","Projects"],["contact","Contact"]];
const store = { get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch (e) {} } };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let timer, io;

$("brand").innerHTML = E(CONFIG.name) + "<span>.dev</span>";
$("foot").innerHTML = "&copy; " + new Date().getFullYear() + " " + E(CONFIG.name) + ". All rights reserved.";
$("nav").innerHTML = PAGES.map(p => '<a href="#' + p[0] + '" data-p="' + p[0] + '">' + p[1] + "</a>").join("");
const closeMenu = () => { $("nav").classList.remove("open"); $("burger").setAttribute("aria-expanded", "false"); };
$("burger").onclick = () => { const o = $("nav").classList.toggle("open"); $("burger").setAttribute("aria-expanded", o); };
$("nav").onclick = e => { if (e.target.closest("a")) closeMenu(); };   // also closes when tapping the current page
const root = document.documentElement;
function theme(t) { root.setAttribute("data-theme", t); $("theme").textContent = t === "dark" ? "☀️" : "🌙"; store.set("theme", t); }
theme(store.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("theme").onclick = () => theme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
$("top").onclick = () => scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
addEventListener("scroll", () => {
  const h = document.documentElement, max = h.scrollHeight - innerHeight;
  $("prog").style.width = (max > 0 ? scrollY / max * 100 : 0) + "%";
  $("top").classList.toggle("show", scrollY > 500);
}, { passive: true });

const head = (h, p) => '<div class="ph rv"><div class="wrap"><h1>' + h + "</h1><p>" + p + "</p></div></div>";
const stats = () => CONFIG.stats.map(s => '<div class="stat glass rv"><b data-n="' + E(s.number) + '">' + E(s.number) + "</b><span>" + E(s.label) + "</span></div>").join("");
const bgOf = p => p.image ? "background-image:url(" + E(p.image) + ")" : "background:" + E(p.color || "#ffd23f");
const cards = list => list.map((p, i) =>
  '<div class="rv" data-t="' + E(p.type) + '"><button class="pj glass" data-i="' + CONFIG.projects.indexOf(p) + '" aria-haspopup="dialog"><div class="pi" style="' + bgOf(p) + '">' + (p.image ? "" : E(p.title)) +
  '</div><div class="pb"><h3>' + E(p.title) + "</h3><p>" + E(p.text) + "</p>" + p.tags.map(t => '<span class="tag">' + E(t) + "</span>").join("") + "</div></button></div>").join("");

const VIEWS = {
  home: () => '<header class="hero"><div class="wrap split"><div><span class="pill"><i></i>Open to internships and freelance</span><h1>Hi, I’m ' + E(CONFIG.name) + '. I build <span class="grad">websites</span> that work.</h1>' +
    '<div class="role"><span id="role"></span><span class="caret"></span></div><p class="lead">' + E(CONFIG.heroText) + '</p>' +
    '<div class="row"><a class="btn fill" href="#projects">See my projects</a><a class="btn" href="#contact">Get in touch</a>' +
    (CONFIG.cv ? '<a class="btn" href="' + E(CONFIG.cv) + '" download>Download CV</a>' : "") + '</div></div>' +
    '<div><div class="pw"><div class="pf" id="pf"></div></div><label class="pu">Change photo <u>(saved in this browser)</u><input type="file" id="pin" accept="image/*"></label></div></div></header>' +
    '<section class="blk"><div class="wrap grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">' + stats() + "</div></section>" +
    '<section class="blk"><div class="wrap"><div class="sp rv"><h2 class="st">Featured projects</h2><a href="#projects">View all projects →</a></div><div class="grid g3">' + cards(CONFIG.projects.slice(0, 3)) + "</div></div></section>" +
    '<section class="blk"><div class="wrap"><div class="glass cta rv"><h2 class="st">Have a project in mind?</h2><p>I’m open to internships and freelance work.</p><a class="btn" href="#contact">Contact me</a></div></div></section>',
  about: () => head("About me", "Who I am and how I got into web development.") +
    '<section class="blk"><div class="wrap split top"><div class="txt rv">' + CONFIG.about.map(p => "<p>" + E(p) + "</p>").join("") + '</div><div class="grid g4">' + stats() + "</div></div></section>" +
    '<section class="blk" style="padding-top:0"><div class="wrap"><h2 class="st rv">Education and experience</h2><div class="tl">' +
    CONFIG.journey.map(j => '<div class="ti rv"><small>' + E(j.when) + '</small><h3>' + E(j.title) + "</h3><p>" + E(j.text) + "</p></div>").join("") + "</div></div></section>",
  skills: () => head("Skills", "The tools I use to build websites.") +
    '<section class="blk"><div class="wrap split top"><div>' + CONFIG.skills.map(s => '<div class="sk rv"><div class="sn"><span>' + E(s.name) + "</span><span>" + s.level +
    '%</span></div><div class="tr" role="progressbar" aria-label="' + E(s.name) + '" aria-valuenow="' + s.level + '" aria-valuemin="0" aria-valuemax="100"><i data-w="' + s.level + '"></i></div></div>').join("") +
    '</div><div class="rv"><h2 class="st" style="font-size:1.2rem">Also working with</h2>' + CONFIG.chips.map(c => '<span class="chip">' + E(c) + "</span>").join("") + "</div></div></section>",
  projects: () => head("Projects", "Things I’ve built. Click a project for details.") +
    '<section class="blk"><div class="wrap"><div class="fl" id="fl">' + ["All", ...new Set(CONFIG.projects.map(p => p.type))].map((t, i) => '<button data-t="' + E(t) + '"' + (i ? "" : ' class="on"') + ">" + E(t) + "</button>").join("") +
    '</div><div class="grid g3" id="pg">' + cards(CONFIG.projects) + "</div></div></section>",
  contact: () => head("Contact", "Have a project, an internship or a question? Send a message and I’ll reply soon.") +
    '<section class="blk"><div class="wrap"><div class="glass box rv"><div class="split top"><div><h2 class="st">Let’s talk</h2><p style="color:var(--muted)"><a href="mailto:' + E(CONFIG.email) + '">' + E(CONFIG.email) + '</a> <button class="btn" id="cp" type="button" style="padding:.2rem .7rem;font-size:.85rem">Copy</button><br><br>' +
    CONFIG.links.map(l => '<a href="' + E(l.url) + '" target="_blank" rel="noopener">' + E(l.label) + "</a>").join(" · ") + '</p></div>' +
    '<form class="fm" id="fm" novalidate><div class="two"><input id="n" placeholder="Your name" aria-label="Your name" autocomplete="name"><input id="e" type="email" placeholder="Your email" aria-label="Your email" autocomplete="email"></div>' +
    '<textarea id="m" rows="4" placeholder="Your message" aria-label="Your message"></textarea><div class="msg" id="st" role="status" aria-live="polite"></div><button class="btn fill" style="justify-self:start">Send message</button></form></div></div></div></section>'
};

const AFTER = {
  home() {
    const initials = CONFIG.name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
    const frame = $("pf"), fallback = () => frame.innerHTML = "<b>" + E(initials) + "</b>";
    const list = [store.get("photo"), CONFIG.photo, BUILT_IN_PHOTO].filter(Boolean);
    (function load(i) {
      if (i >= list.length) return fallback();
      const im = new Image(); im.alt = "Photo of " + CONFIG.name;
      im.onload = () => { frame.innerHTML = ""; frame.appendChild(im); }; im.onerror = () => load(i + 1); im.src = list[i];
    })(0);
    $("pin").onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const u = URL.createObjectURL(f), im = new Image();
      im.onload = () => {
        const s = Math.min(1, 600 / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = im.width * s; c.height = im.height * s; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        const url = c.toDataURL("image/jpeg", .85); store.set("photo", url); URL.revokeObjectURL(u);
        frame.innerHTML = '<img alt="Photo of ' + E(CONFIG.name) + '" src="' + url + '">';
      };
      im.onerror = () => URL.revokeObjectURL(u); im.src = u;
    };
    const el = $("role"); let r = 0, c = 0, del = false;
    if (reduce) { el.textContent = CONFIG.roles.join(" · "); return; }
    (function tick() {
      const w = CONFIG.roles[r]; el.textContent = w.slice(0, c);
      if (!del && c === w.length) { del = true; timer = setTimeout(tick, 1400); return; }
      if (del && c === 0) { del = false; r = (r + 1) % CONFIG.roles.length; }
      c += del ? -1 : 1; timer = setTimeout(tick, del ? 40 : 90);
    })();
  },
  skills() { setTimeout(() => document.querySelectorAll(".tr i").forEach(i => i.style.width = i.dataset.w + "%"), 200); },
  projects() {
    $("fl").onclick = e => {
      const b = e.target.closest("button"); if (!b) return;
      document.querySelectorAll("#fl button").forEach(x => x.classList.toggle("on", x === b));
      document.querySelectorAll("#pg > div").forEach(c => c.hidden = b.dataset.t !== "All" && c.dataset.t !== b.dataset.t);
    };
  },
  contact() {
    const st = (t, k) => { $("st").textContent = t; $("st").className = "msg " + (k || ""); };
    $("cp").onclick = async () => { try { await navigator.clipboard.writeText(CONFIG.email); $("cp").textContent = "Copied ✓"; } catch (e) { $("cp").textContent = "Press Ctrl+C"; } setTimeout(() => $("cp") && ($("cp").textContent = "Copy"), 1800); };
    $("fm").onsubmit = e => {
      e.preventDefault();
      const n = $("n"), em = $("e"), m = $("m");
      [n, em, m].forEach(x => x.classList.remove("bad"));
      const okMail = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim());
      if (!n.value.trim()) { n.classList.add("bad"); n.focus(); return st("Please enter your name.", "err"); }
      if (!okMail) { em.classList.add("bad"); em.focus(); return st("Please enter a valid email address.", "err"); }
      if (m.value.trim().length < 10) { m.classList.add("bad"); m.focus(); return st("Please write a message (at least 10 characters).", "err"); }
      st("Opening your email app… if nothing opens, copy my address above.", "ok");
      location.href = "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent("Portfolio message from " + n.value.trim()) +
        "&body=" + encodeURIComponent(m.value.trim() + "\n\nReply to: " + em.value.trim());
    };
  }
};

/* Project detail dialog (replaces the old "#" links that reopened the page) */
$("app").addEventListener("click", e => {
  const b = e.target.closest(".pj"); if (!b) return;
  const p = CONFIG.projects[+b.dataset.i], real = p.link && p.link !== "#";
  $("dlg").innerHTML = '<div class="pi" style="' + bgOf(p) + '">' + (p.image ? "" : E(p.title)) + '</div><div class="dg"><h3>' + E(p.title) + "</h3><p>" + E(p.text) + "</p>" +
    p.tags.map(t => '<span class="tag">' + E(t) + "</span>").join("") + '<div class="row">' +
    (real ? '<a class="btn fill" href="' + E(p.link) + '" target="_blank" rel="noopener">Open project ↗</a>' : '<span class="tag">Live link coming soon</span>') +
    '<button class="btn" id="dx">Close</button></div></div>';
  $("dx").onclick = () => $("dlg").close();
  $("dlg").showModal();
});
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });

function counters() {
  document.querySelectorAll("[data-n]").forEach(el => {
    const m = el.dataset.n.match(/^(\d+)(.*)$/); if (!m || reduce) return;
    const end = +m[1], t0 = performance.now();
    (function f(t) { const k = Math.min(1, (t - t0) / 1100); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))) + m[2]; if (k < 1) requestAnimationFrame(f); })(t0);
  });
}
function reveal() {
  const els = document.querySelectorAll(".rv");
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) return els.forEach(x => x.classList.add("in"));
  io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .12 });
  els.forEach((x, i) => { x.style.transitionDelay = (i % 4) * 70 + "ms"; io.observe(x); });
}

function show() {
  clearTimeout(timer);
  if ($("dlg").open) $("dlg").close();
  const p = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "home";
  $("app").innerHTML = VIEWS[p]();
  document.querySelectorAll("#nav a").forEach(a => { a.classList.toggle("on", a.dataset.p === p); a.toggleAttribute("aria-current", a.dataset.p === p); });
  closeMenu();
  document.title = (p === "home" ? "" : PAGES.find(x => x[0] === p)[1] + " | ") + CONFIG.name + " | Web Developer";
  scrollTo(0, 0);
  if (AFTER[p]) AFTER[p]();
  reveal(); counters();
}
addEventListener("hashchange", show);
show();
</script>
